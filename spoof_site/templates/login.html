{% extends "base.html" %}
{% block title %}Sign in — PixelVault Games{% endblock %}
{% block content %}
<section class="auth">
  <h1>Sign in</h1>
  <p class="muted">Welcome back. Sign in to your {{ product.title }} account.</p>

  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}

  <!--
    This form POSTs to THIS origin (127.0.0.1:5001), not the real store. The server
    discards whatever is typed, records only a non-sensitive event, and returns an
    "Invalid email or password." error. It authenticates no one.
  -->
  <form method="post" action="{{ url_for('login') }}" autocomplete="on">
    <label>Email
      <input type="email" name="email" autocomplete="username"
             placeholder="{{ demo_email }}" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Sign in</button>
  </form>

  <p>New here? <a href="{{ url_for('signup') }}">Create an account</a> to claim the
     launch discount.</p>
</section>
{% endblock %}
