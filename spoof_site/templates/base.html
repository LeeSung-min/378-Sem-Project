<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PixelVault Games{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="logo">◆</span> PixelVault<span class="brand-accent">Games</span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}">Store</a>
      <a href="{{ url_for('signup') }}">GTA VI</a>
      <a href="{{ url_for('login') }}">Cart</a>
      <a href="{{ url_for('login') }}">Login</a>
      <a class="btn-sm" href="{{ url_for('signup') }}">Claim discount</a>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <p>Educational simulation only. Not affiliated with any real company. No real
       accounts, products, or payments. <a href="{{ url_for('about') }}">About this
       demonstration</a>.</p>
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
