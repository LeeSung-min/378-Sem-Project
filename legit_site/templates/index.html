{% extends "base.html" %}
{% block content %}
<section class="hero">
  <div class="hero-text">
    <p class="eyebrow">Now available for pre-order</p>
    <h1>{{ featured.title }}</h1>
    <p class="lead">{{ featured.tagline }}</p>
    <a class="btn" href="{{ url_for('product', slug=featured.slug) }}">View game</a>
  </div>
  <div class="hero-art art-cover a{{ featured.art }}" aria-hidden="true">
    <span>{{ featured.title }}</span>
  </div>
</section>

<h2 class="section-title">Browse games</h2>
<div class="grid">
  {% for game in catalog %}
  <article class="card">
    <a href="{{ url_for('product', slug=game.slug) }}" class="card-art">
      <div class="art-thumb a{{ game.art }}" aria-hidden="true"></div>
    </a>
    <div class="card-body">
      <h3><a href="{{ url_for('product', slug=game.slug) }}">{{ game.title }}</a></h3>
      <p class="muted">${{ "%.2f"|format(game.price) }}</p>
      <div class="card-actions">
        <a class="btn-sm ghost" href="{{ url_for('product', slug=game.slug) }}">Details</a>
        <form method="post" action="{{ url_for('cart_add') }}" class="inline">
          <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <input type="hidden" name="slug" value="{{ game.slug }}">
          <button class="btn-sm" type="submit">Add to cart</button>
        </form>
      </div>
    </div>
  </article>
  {% endfor %}
</div>
{% endblock %}
