{% extends "base.html" %}
{% block title %}{{ product.title }} — PixelVault Games{% endblock %}
{% block content %}
<section class="product">
  <div class="art-cover large" aria-hidden="true"><span>{{ product.title }}</span></div>
  <div class="product-info">
    <h1>{{ product.title }}</h1>
    <p class="price-big">{{ product.price }}</p>
    <p>{{ product.description }}</p>
    <h3>Screenshots</h3>
    <div class="shots">
      {% for s in product.screens %}
        <div class="shot" aria-hidden="true"><span>{{ s }}</span></div>
      {% endfor %}
    </div>
    <form method="get" action="{{ url_for('cart') }}">
      <button class="btn" type="submit">Add to cart (demo)</button>
    </form>
  </div>
</section>
{% endblock %}
